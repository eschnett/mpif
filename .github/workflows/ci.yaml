name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Everything that needs no MPI, no compiler and no build, so it runs once
  # rather than once per variant and answers in seconds. Not a dependency of the
  # jobs below: it would delay all of them by a runner start-up for a check that
  # takes a moment, and a failure here fails the run either way.
  checks:
    name: source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The sentinels are Cray pointers whose pointer variable lives in a common
      # block that src/mpif_constants.c defines. A `pointer (P, X)` whose name
      # does not match its `common /P/ P` is a fresh implicitly declared local
      # that nothing ever assigns, so X sits at an arbitrary address and MPI
      # writes through it -- and nothing warns, both spellings being valid
      # Fortran. This is the only thing that would catch it.
      - name: Check the Cray pointers against their common blocks
        run: bash ci-scripts/check-headers.sh

  build:
    name: ${{ matrix.mpi }} / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # The runner label carries the architecture, so another architecture is
        # just another entry in `os`. Everything downstream already adapts at run
        # time: `brew --prefix` finds Homebrew wherever it lives, SHLIB_EXT
        # follows from the label, and the compilers are chosen from RUNNER_OS.
        #
        # x86-64 is covered on Linux only, deliberately. The free Intel macOS
        # images have been retired and `macos-15-intel` is not a valid label, so
        # x86-64 macOS would mean a larger runner, which is billed even for
        # public repositories.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        mpi: [mpich, openmpi]
        toolchain: [gcc, llvm]

    env:
      # Suffix of shared libraries
      SHLIB_EXT: ${{ startsWith(matrix.os, 'macos') && 'dylib' || 'so' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set here rather than in the job's `env:`, because the `runner` context
      # is not available there. The prefixes carry the implementation's name --
      # opt/mpi-mpich, not opt/mpi -- because the cross job below restores both
      # implementations' prefixes onto one runner, at the exact absolute paths
      # everything baked at build time (wrapper defaults, RPATHs, macOS install
      # names), and those paths must not collide.
      - name: Set up paths
        run: |
          {
              echo "MPI_PREFIX=${RUNNER_TEMP}/opt/mpi-${{ matrix.mpi }}"
              echo "MPIF_PREFIX=${RUNNER_TEMP}/opt/mpif-${{ matrix.mpi }}"
              echo "MPI_SRC_DIR=${RUNNER_TEMP}/mpi-src"
              echo "CCACHE_DIR=${RUNNER_TEMP}/ccache"
              echo "CCACHE_MAXSIZE=500M"
          } >>"${GITHUB_ENV}"

      - name: Install dependencies (Linux, GCC)
        if: runner.os == 'Linux' && matrix.toolchain == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              autoconf \
              automake \
              ccache \
              cmake \
              gfortran \
              libhwloc-dev \
              libtool \
              pkg-config

      - name: Install dependencies (Linux, LLVM)
        if: runner.os == 'Linux' && matrix.toolchain == 'llvm'
        run: |
          curl -fsSLO https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y \
              autoconf \
              automake \
              ccache \
              clang-21 \
              cmake \
              flang-21 \
              libc++-21-dev \
              libc++abi-21-dev \
              libhwloc-dev \
              libomp-21-dev \
              libtool \
              lld-21 \
              llvm-21 \
              pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake ccache hwloc libtool
          # hwloc, like everything else Homebrew installs, lives under `brew --prefix`
          echo "HWLOC_PREFIX=$(brew --prefix)" >>"${GITHUB_ENV}"

      - name: Install dependencies (macOS, LLVM)
        if: runner.os == 'macOS' && matrix.toolchain == 'llvm'
        run: brew install flang llvm

      # Chosen here rather than in the matrix so that there is a single place
      # where a compiler name has to be adjusted, and so that macOS can look up
      # Homebrew's paths at run time.
      - name: Select toolchain
        run: |
          case "${RUNNER_OS}-${{ matrix.toolchain }}" in
              Linux-gcc)
                  cc=gcc cxx=g++ fc=gfortran
                  ;;
              Linux-llvm)
                  cc=clang-21 cxx=clang++-21 fc=flang-21
                  ;;
              macOS-gcc)
                  # Homebrew GCC, preinstalled on the runner image
                  cc=gcc-15 cxx=g++-15 fc=gfortran-15
                  ;;
              macOS-llvm)
                  # Homebrew's clang and flang are not on PATH by default, and
                  # `flang-new` was renamed to `flang` in LLVM 20
                  cc=clang cxx=clang++ fc=flang
                  bindirs=$(brew --prefix llvm)/bin:$(brew --prefix flang)/bin
                  if [[ ! -x $(brew --prefix flang)/bin/flang ]]; then
                      fc=flang-new
                  fi
                  ;;
          esac
          # Compiler names are kept bare so that ccache can be put in front of
          # them below, and so that the `mpicc`/`mpifort` wrappers that MPI and
          # mpif install do not record paths specific to this runner.
          echo "PATH=${bindirs:+${bindirs}:}${PATH}" >>"${GITHUB_ENV}"
          {
              echo "CC=${cc}"
              echo "CXX=${cxx}"
              echo "FC=${fc}"
          } >>"${GITHUB_ENV}"
          export PATH=${bindirs:+${bindirs}:}${PATH}
          for var in cc cxx fc; do
              command -v "${!var}"
              "${!var}" --version | head -1
          done

      # ccache in masquerade mode: symlinks named after the compilers, ahead of
      # them on PATH. Nothing has to know about ccache, and in particular the
      # installed compiler wrappers still refer to the real compilers. Fortran
      # is left alone, as ccache does not support it.
      - name: Set up ccache
        run: |
          shims=${RUNNER_TEMP}/ccache-shims
          mkdir -p "${shims}"
          ln -sf "$(command -v ccache)" "${shims}/${CC}"
          ln -sf "$(command -v ccache)" "${shims}/${CXX}"
          echo "PATH=${shims}:${PATH}" >>"${GITHUB_ENV}"
          # Verify that the masquerade works: ccache has to be found first, and
          # has to resolve to the intended compiler and not, say, Apple clang.
          export PATH=${shims}:${PATH}
          test "$(command -v "${CC}")" = "${shims}/${CC}"
          "${CC}" --version | head -1

      # Three caches, from coarsest to finest. The MPI installation is all that
      # is needed for a run that changes neither the bindings nor the build
      # scripts; the other two only come into play when it misses.
      #
      # What building and installing an MPI reads, and nothing else: everything in
      # `ci-scripts/` except `ci-scripts/suite/`, which is read only after the MPI
      # exists and cannot change it, and except the README, which nothing reads.
      # Hashing the suite too meant one triaged suite failure rebuilt MPI on all
      # twelve variants.
      #
      # The exclusions are why this is not simply `ci-scripts/*`. That pattern
      # matches the *directory* `ci-scripts/suite`, and `@actions/glob` expands a
      # matched directory to all of its descendants -- `implicitDescendants`
      # defaults to true -- so the single `*` excluded nothing and the suite's files
      # stayed in the key. That was measured, not guessed: the hash the caches
      # carried is reproduced exactly by hashing `ci-scripts/*` with the suite's
      # three files included, 19 files rather than 16.
      #
      # Patterns rather than a list of filenames, so that a new install input is
      # covered without an edit here; `ci-scripts/README.md` has the rest of the
      # reasoning.
      # The `mpi2-` key prefix (previously `mpi-`) is deliberate: actions/cache
      # restores an archive to the absolute paths recorded when it was saved, so
      # a cache saved under the old opt/mpi path would restore *there* while
      # this job expects opt/mpi-<implementation>, and the mismatch would look
      # like a broken installation rather than a stale cache.
      - name: Cache MPI installation
        id: cache-mpi
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/opt/mpi-${{ matrix.mpi }}
          key: mpi2-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-${{ hashFiles('ci-scripts/**', '!ci-scripts/suite/**', '!ci-scripts/README.md', 'fortran/**') }}

      # The downloaded and autogen'ed source tree. Its key deliberately ignores
      # `fortran/`, so editing the bindings still skips the clone, the
      # submodules and `autogen`. It does cover the patches the install scripts
      # apply, which are part of the prepared tree. Saved explicitly right after
      # preparing it, because by the end of the job the tree also holds all the
      # build output.
      - name: Restore MPI source tree
        id: cache-mpi-src
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/mpi-src
          key: mpi-src-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-${{ hashFiles('ci-scripts/install-*.sh', 'ci-scripts/*.patch') }}

      - name: Prepare MPI source tree
        if: steps.cache-mpi.outputs.cache-hit != 'true' && steps.cache-mpi-src.outputs.cache-hit != 'true'
        env:
          MPI_PREPARE_ONLY: 1
        run: ci-scripts/install-${{ matrix.mpi }}.sh

      - name: Save MPI source tree
        if: steps.cache-mpi.outputs.cache-hit != 'true' && steps.cache-mpi-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/mpi-src
          key: ${{ steps.cache-mpi-src.outputs.cache-primary-key }}

      # Compiler cache, so that a change to the bindings recompiles only what
      # actually changed. Restored from whatever the most recent run left, and
      # saved under a fresh key because caches are immutable.
      - name: Restore ccache
        id: cache-ccache
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-

      - name: Build and install ${{ matrix.mpi }}
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        run: |
          ccache --zero-stats
          ci-scripts/install-${{ matrix.mpi }}.sh "${MPI_PREFIX}"
          ccache --show-stats

      - name: Save ccache
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      - name: Add MPI to the environment
        run: |
          echo "${MPI_PREFIX}/bin" >>"${GITHUB_PATH}"
          if [[ ${RUNNER_OS} == Linux ]]; then
              echo "LD_LIBRARY_PATH=${MPI_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >>"${GITHUB_ENV}"
          fi
          # macOS needs no equivalent: the libraries carry an `@rpath`
          # install name, and the executables an rpath pointing at them.

      # The install scripts run this too, but not when the installation came
      # from the cache -- and its output is what diagnoses a broken one.
      - name: Check the MPI installation
        run: ci-scripts/check-mpi-install.sh "${MPI_PREFIX}"

      - name: Configure, build, and install mpif
        run: |
          cmake \
              -Bbuild \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DCMAKE_INSTALL_PREFIX="${MPIF_PREFIX}" \
              -DMPI_HOME="${MPI_PREFIX}"
          cmake --build build --parallel
          cmake --install build

      - name: Configure, build, and run tests
        run: |
          # The MPI these tests build and run against is the *default the mpif
          # installation remembers*, read back from the installed wrapper
          # rather than respecified as ${MPI_PREFIX}: what is under test is
          # what the installation would give a user. In this job the two are
          # the same directory; the cross job below is where they differ.
          mpi_prefix=$("${MPIF_PREFIX}/bin/mpifort" -showme:mpiprefix)
          #
          # The alltoallw tests need more than one rank, so they need a launcher.
          # It is pinned rather than detected: `find_package(MPI)` picks mpiexec
          # off the PATH, and while the step above puts the MPI's bin first,
          # depending on that order is how a run ends up testing mpif against an
          # MPI it was not built against. test/CMakeLists.txt fails the configure
          # if this is missing.
          #
          # CMake takes a preflag list semicolon-separated, and Open MPI needs
          # the same two things the suite step below does, for the same reasons
          # given there: it refuses to oversubscribe, and left to itself it picks
          # an interface it cannot use. MPICH needs neither, and gets no flag at
          # all rather than an empty one.
          #
          # MPIF_TEST_MPI_LIBRARY makes the environment-check tests assert which
          # implementation MPI_Get_library_version reports -- here the one mpif
          # was built against, in the cross job the other one.
          cmake_args=()
          if [[ ${{ matrix.mpi }} == openmpi ]]; then
              mpi_library="Open MPI"
              if [[ ${RUNNER_OS} == macOS ]]; then
                  loopback=lo0
              else
                  loopback=lo
              fi
              cmake_args+=("-DMPIEXEC_PREFLAGS=--oversubscribe;--mca;btl_tcp_if_include;${loopback}")
          else
              mpi_library=MPICH
          fi
          cmake \
              -Stest \
              -Bbuild-tests \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DMPI_C_COMPILER="${mpi_prefix}/bin/mpicc" \
              -DMPI_Fortran_COMPILER="${MPIF_PREFIX}/bin/mpifort" \
              -DMPI_C_HEADER_DIR="${mpi_prefix}/include" \
              -DMPI_C_LIB_NAMES=mpi_abi \
              -DMPI_mpi_abi_LIBRARY="${mpi_prefix}/lib/libmpi_abi.${SHLIB_EXT}" \
              -DMPIEXEC_EXECUTABLE="${mpi_prefix}/bin/mpiexec" \
              -DMPIF_TEST_MPI_LIBRARY="${mpi_library}" \
              "${cmake_args[@]}"
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure

      # MPICH's own suite has ~300 Fortran tests across mpif.h, `use mpi` and
      # `use mpi_f08`, and disables all of them for the standard ABI because the
      # ABI has no Fortran bindings -- which is what mpif supplies. Far broader
      # coverage than test/, so worth running even before every test passes.
      # The failures that are expected are listed in
      # ci-scripts/suite/mpich-suite-xfail.txt with a reason apiece, and the step fails
      # on a difference from that list rather than on a failure -- in either
      # direction, so a test that starts passing is caught too. A variant with no
      # `triaged` line there is reported and cannot fail, which is how the
      # variants nobody has measured yet stay honest.
      - name: Run MPICH's Fortran test suite
        run: |
          # Open MPI refuses to oversubscribe by default, and the runners have
          # fewer cores than the suite asks processes for
          if [[ ${{ matrix.mpi }} == openmpi ]]; then
              args=--oversubscribe
              # Keep Open MPI on the loopback interface: everything here runs on
              # one host, so no other interface is wanted, and left to itself it
              # picks one it cannot use. On macOS that is fatal --
              # "setsockopt(TCP_NODELAY) failed: Invalid argument (22)" and its own
              # warning that this "may end up hanging", which it does, in every
              # test that communicates across a spawned intercommunicator, each
              # then burning runtests' 180-second timeout. On Linux's x86_64
              # runners it picked the docker0 bridge those images have.
              #
              # The interface is lo0 on macOS and lo on Linux. See
              # scripts/macos-test-mpich-suite.sh, which does the same locally.
              if [[ ${RUNNER_OS} == macOS ]]; then
                  args="${args} --mca btl_tcp_if_include lo0"
              else
                  args="${args} --mca btl_tcp_if_include lo"
              fi
              export MPIEXEC_ARGS="${args}"
          fi
          # The runtime MPI is the installation's remembered default, as in the
          # test step above.
          ci-scripts/suite/test-mpich-suite.sh \
              "$("${MPIF_PREFIX}/bin/mpifort" -showme:mpiprefix)" "${MPIF_PREFIX}"

      # Hand both prefixes to the cross job below. tar first: upload-artifact
      # dereferences symbolic links, and lib/libmpi_abi.so -> libmpi_abi.so.1
      # and friends must arrive as links, not copies.
      - name: Upload the prefixes for the cross job
        run: |
          tar -C "${RUNNER_TEMP}" -czf \
              "prefixes-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}.tar.gz" \
              "opt/mpi-${{ matrix.mpi }}" "opt/mpif-${{ matrix.mpi }}"

      - uses: actions/upload-artifact@v4
        with:
          name: prefixes-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}
          path: prefixes-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}.tar.gz
          retention-days: 2
          if-no-files-found: error

      # CMake keeps the compiler and linker output of its own checks -- such as
      # the one behind `missing: MPI_C_WORKS` -- in these files, and reports
      # only the conclusion on the console.
      - name: Show CMake's check logs
        if: failure()
        run: |
          for dir in build build-tests; do
              for log in "${dir}"/CMakeFiles/CMakeConfigureLog.yaml \
                         "${dir}"/CMakeFiles/CMakeError.log; do
                  if [[ -f ${log} ]]; then
                      echo "::group::${log}"
                      cat "${log}"
                      echo "::endgroup::"
                  fi
              done
          done

  # The cross-implementation tests: mpif is built against the C MPI ABI, so a
  # build made against one implementation must work, unchanged, with the
  # other -- the test results may depend only on the MPI it *runs* with, never
  # on the MPI it was *built* against. Per (os, toolchain) this job takes the
  # two build jobs' prefixes (both MPIs, both mpifs) and runs the two cross
  # pairings the build jobs cannot: mpif-built-against-MPICH under Open MPI,
  # and the mirror. Toolchains are never mixed -- gcc and llvm Fortran are not
  # ABI-compatible -- so the pairing varies only the MPI.
  #
  # Two models, on purpose:
  # - test/ swaps the runtime under unchanged binaries: everything is linked
  #   against the built mpif's default MPI, and LD_LIBRARY_PATH (macOS:
  #   DYLD_LIBRARY_PATH) puts the other implementation's libmpi_abi -- same
  #   conventional versioned name, libmpi_abi.so.1 -- in front of the rpath'd
  #   default at run time. That is the loader-level mechanism applications use,
  #   tested directly; MPIF_TEST_MPI_LIBRARY makes the tests assert the swap
  #   actually happened.
  # - the MPICH suite relinks against the runtime MPI (test-mpich-suite.sh
  #   exports MPIF_MPI_PREFIX from its first argument): its harness runs
  #   through the system perl and shells, from which macOS SIP strips DYLD_*,
  #   and it recompiles every test per run anyway. Its results are gated
  #   against the *runtime* MPI's rows of mpich-suite-xfail.txt -- the same
  #   rows as that MPI's native run, which is the "results depend only on the
  #   runtime MPI" assertion, enforced by the existing list without new keys.
  cross:
    name: cross / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        toolchain: [gcc, llvm]

    env:
      SHLIB_EXT: ${{ startsWith(matrix.os, 'macos') && 'dylib' || 'so' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The same compilers as the build jobs, because this job compiles test/
      # (four configurations) and the suite's Fortran side. No autotools and no
      # ccache: nothing here builds an MPI.
      - name: Install dependencies (Linux, GCC)
        if: runner.os == 'Linux' && matrix.toolchain == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gfortran libhwloc-dev
      - name: Install dependencies (Linux, LLVM)
        if: runner.os == 'Linux' && matrix.toolchain == 'llvm'
        run: |
          curl -fsSLO https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y \
              clang-21 \
              cmake \
              flang-21 \
              libc++-21-dev \
              libc++abi-21-dev \
              libhwloc-dev \
              libomp-21-dev \
              lld-21 \
              llvm-21
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install hwloc
      - name: Install dependencies (macOS, LLVM)
        if: runner.os == 'macOS' && matrix.toolchain == 'llvm'
        run: brew install flang llvm

      # Identical to the build job's step: the prefixes' wrappers name these
      # compilers bare, so they have to resolve here too.
      - name: Select toolchain
        run: |
          case "${RUNNER_OS}-${{ matrix.toolchain }}" in
              Linux-gcc)
                  cc=gcc cxx=g++ fc=gfortran
                  ;;
              Linux-llvm)
                  cc=clang-21 cxx=clang++-21 fc=flang-21
                  ;;
              macOS-gcc)
                  cc=gcc-15 cxx=g++-15 fc=gfortran-15
                  ;;
              macOS-llvm)
                  cc=clang cxx=clang++ fc=flang
                  bindirs=$(brew --prefix llvm)/bin:$(brew --prefix flang)/bin
                  if [[ ! -x $(brew --prefix flang)/bin/flang ]]; then
                      fc=flang-new
                  fi
                  ;;
          esac
          echo "PATH=${bindirs:+${bindirs}:}${PATH}" >>"${GITHUB_ENV}"
          {
              echo "CC=${cc}"
              echo "CXX=${cxx}"
              echo "FC=${fc}"
          } >>"${GITHUB_ENV}"
          export PATH=${bindirs:+${bindirs}:}${PATH}
          for var in cc cxx fc; do
              command -v "${!var}"
              "${!var}" --version | head -1
          done

      # Restore both implementations' prefixes at the exact absolute paths the
      # build jobs used, so every baked path -- wrapper defaults, RPATHs, macOS
      # install names -- is valid again.
      - uses: actions/download-artifact@v4
        with:
          pattern: prefixes-*-${{ matrix.toolchain }}-${{ matrix.os }}
          merge-multiple: true

      - name: Unpack the prefixes
        run: |
          for archive in prefixes-*-${{ matrix.toolchain }}-${{ matrix.os }}.tar.gz; do
              tar -C "${RUNNER_TEMP}" -xzf "${archive}"
          done
          ls "${RUNNER_TEMP}/opt"

      # The two mpif installations must not depend on the MPI they were built
      # against. The headers and modules must be identical outright. The
      # library must export and reference exactly the same symbols -- it links
      # no MPI, so there is nothing implementation-specific left to differ.
      # Byte identity of the libraries is reported but not (yet) required:
      # it is expected, both jobs building identical sources in identically
      # named directories, but it has not been measured across runners.
      - name: Compare the two mpif installations
        run: |
          a="${RUNNER_TEMP}/opt/mpif-mpich"
          b="${RUNNER_TEMP}/opt/mpif-openmpi"
          diff -r "${a}/include" "${b}/include"
          echo "include/ identical"
          if [[ ${RUNNER_OS} == macOS ]]; then
              liba=${a}/lib/libmpifort_abi.1.0.0.dylib
              libb=${b}/lib/libmpifort_abi.1.0.0.dylib
          else
              liba=${a}/lib/libmpifort_abi.so.1.0.0
              libb=${b}/lib/libmpifort_abi.so.1.0.0
          fi
          symbols() { nm -g "$1" | awk '{ print $(NF-1), $NF }' | sort; }
          diff <(symbols "${liba}") <(symbols "${libb}")
          echo "exported and undefined symbols identical"
          if cmp -s "${liba}" "${libb}"; then
              echo "the libraries are byte-identical"
          else
              echo "note: the libraries differ in their bytes (not required)"
          fi

      # Same binaries, swapped runtime. Each pairing configures test/ exactly
      # as the build job did for the *built* MPI -- compilers, header and
      # library all from the built mpif's remembered default -- except that the
      # launcher is the *runtime* MPI's and the tests expect the runtime
      # implementation's MPI_Get_library_version. The loader search path then
      # swaps libmpi_abi under the unchanged executables at ctest time.
      - name: Cross-run test/ (same binaries, swapped runtime)
        run: |
          for built in mpich openmpi; do
              if [[ ${built} == mpich ]]; then
                  run=openmpi
              else
                  run=mpich
              fi
              echo "::group::built against ${built}, running against ${run}"
              mpif_prefix=${RUNNER_TEMP}/opt/mpif-${built}
              run_prefix=${RUNNER_TEMP}/opt/mpi-${run}
              link_prefix=$("${mpif_prefix}/bin/mpifort" -showme:mpiprefix)
              cmake_args=()
              if [[ ${run} == openmpi ]]; then
                  mpi_library="Open MPI"
                  if [[ ${RUNNER_OS} == macOS ]]; then
                      loopback=lo0
                  else
                      loopback=lo
                  fi
                  cmake_args+=("-DMPIEXEC_PREFLAGS=--oversubscribe;--mca;btl_tcp_if_include;${loopback}")
              else
                  mpi_library=MPICH
              fi
              builddir=build-tests-${built}-run-${run}
              cmake \
                  -Stest \
                  -B"${builddir}" \
                  -DCMAKE_BUILD_TYPE=Debug \
                  -DCMAKE_C_COMPILER="${CC}" \
                  -DCMAKE_Fortran_COMPILER="${FC}" \
                  -DMPI_C_COMPILER="${link_prefix}/bin/mpicc" \
                  -DMPI_Fortran_COMPILER="${mpif_prefix}/bin/mpifort" \
                  -DMPI_C_HEADER_DIR="${link_prefix}/include" \
                  -DMPI_C_LIB_NAMES=mpi_abi \
                  -DMPI_mpi_abi_LIBRARY="${link_prefix}/lib/libmpi_abi.${SHLIB_EXT}" \
                  -DMPIEXEC_EXECUTABLE="${run_prefix}/bin/mpiexec" \
                  -DMPIF_TEST_MPI_LIBRARY="${mpi_library}" \
                  "${cmake_args[@]}"
              cmake --build "${builddir}" --parallel
              if [[ ${RUNNER_OS} == macOS ]]; then
                  DYLD_LIBRARY_PATH="${run_prefix}/lib" \
                      ctest --test-dir "${builddir}" --output-on-failure
              else
                  LD_LIBRARY_PATH="${run_prefix}/lib" \
                      ctest --test-dir "${builddir}" --output-on-failure
              fi
              echo "::endgroup::"
          done

      # The broad test: the MPICH suite, ~300 Fortran tests, with the Fortran
      # side supplied by the mpif built against the *other* implementation.
      # test-mpich-suite.sh relinks against its first argument and gates
      # against that runtime MPI's expected-failure rows; a cross run must
      # therefore report exactly what the native run of that MPI reported.
      # Each pairing gets its own tree: two suite runs sharing one rebuild and
      # delete executables under each other.
      - name: Cross-run the MPICH suite (relinked against the runtime)
        run: |
          for built in mpich openmpi; do
              if [[ ${built} == mpich ]]; then
                  run=openmpi
              else
                  run=mpich
              fi
              echo "::group::built against ${built}, running against ${run}"
              mpif_prefix=${RUNNER_TEMP}/opt/mpif-${built}
              run_prefix=${RUNNER_TEMP}/opt/mpi-${run}
              unset MPIEXEC_ARGS
              if [[ ${run} == openmpi ]]; then
                  args=--oversubscribe
                  if [[ ${RUNNER_OS} == macOS ]]; then
                      args="${args} --mca btl_tcp_if_include lo0"
                  else
                      args="${args} --mca btl_tcp_if_include lo"
                  fi
                  export MPIEXEC_ARGS="${args}"
              fi
              if [[ ${RUNNER_OS} == Linux ]]; then
                  export LD_LIBRARY_PATH="${run_prefix}/lib"
              fi
              MPICH_TESTS_DIR="${RUNNER_TEMP}/tests-${built}-run-${run}" \
                  ci-scripts/suite/test-mpich-suite.sh "${run_prefix}" "${mpif_prefix}"
              echo "::endgroup::"
          done

      - name: Show CMake's check logs
        if: failure()
        run: |
          for dir in build-tests-*; do
              for log in "${dir}"/CMakeFiles/CMakeConfigureLog.yaml \
                         "${dir}"/CMakeFiles/CMakeError.log; do
                  if [[ -f ${log} ]]; then
                      echo "::group::${log}"
                      cat "${log}"
                      echo "::endgroup::"
                  fi
              done
          done

  # The 32-bit variant, which the job above cannot express. The suite's
  # expected-failure list is keyed on `uname -m` among other things, and a `-m32`
  # build on an x86_64 runner still reports `x86_64` -- so it would share a row
  # with the 64-bit build, which is the one collision that key exists to prevent.
  # A 32-bit userland reports a 32-bit `uname`; a 32-bit compiler flag does not.
  # (Ubuntu's i386 multiarch package set is also a whitelist that has no
  # `libhwloc-dev:i386`.)
  #
  # So this runs the container instead, which is where the 32-bit variants are
  # described anyway. `linux/386` executes natively on the x86_64 kernel -- no
  # qemu -- so it costs about what the jobs above cost. The dockerfile builds
  # MPICH, builds and installs mpif, runs test/ and then runs the suite, all as
  # `RUN` steps, so a build that succeeds is a test run that passed.
  #
  # MPICH only, and not for cost: Open MPI's release notes say "32-bit
  # environments are no longer supported". See MISSING.md. gcc only because
  # flang has no 32-bit x86 Fortran runtime to speak of.
  #
  # `docker/mpich-gcc-arm32v7.dockerfile` is the other 32-bit ABI and is not here:
  # every instruction is emulated, and MPICH from source plus ~300 suite tests
  # does not fit this timeout. Worth adding on a schedule.
  container:
    name: ${{ matrix.variant }} (container)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        variant: [mpich-gcc-i386]
        include:
          - variant: mpich-gcc-i386
            platform: linux/386

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # For the GitHub Actions cache backend below, which the default `docker`
      # driver does not support.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The image is not pushed or loaded: the build itself is the test. Layer
      # caching stands in for the three caches the job above keeps, and the
      # dockerfile is ordered for it -- the suite's files arrive in the last
      # `COPY`, so editing the expected-failures list reuses the MPICH layer
      # instead of rebuilding it. `mode=max` because the layer worth reusing is
      # an intermediate one; the final image is thrown away.
      #
      # That competes for the repository's 10 GB of Actions cache with the three
      # caches the job above keeps per variant. If it starts evicting them --
      # visible as MPI cache misses on runs that changed nothing the key covers --
      # drop the `cache-to` line and let this job rebuild MPICH each time. It is a
      # native build, so that costs minutes rather than the hour it would cost
      # under qemu.
      - name: Build and test in a ${{ matrix.platform }} container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.variant }}.dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # A third operating system, which the `build` matrix cannot express because
  # GitHub has no FreeBSD runner: an Ubuntu runner boots a FreeBSD VM under qemu
  # and runs the same recipe inside it -- install MPICH, build and install mpif,
  # run test/, run MPICH's Fortran suite.
  #
  # It earns its place by being a libc, a linker and a toolchain layout that
  # nothing else here covers, on a platform where mpif's assumptions had never
  # been run at all. Both of the portability defects this job's own preparation
  # found were in the recipe rather than in the bindings -- `#!/bin/bash`, which
  # is not a path FreeBSD has, and the two readelf implementations printing
  # SONAME differently -- and both are fixed in ci-scripts/ rather than worked
  # around here.
  #
  # The compilers are the platform's own mix, which is neither of the two
  # toolchains the matrix above knows. C and C++ come from the base system, whose
  # compiler is clang -- FreeBSD ships no GCC at all -- so `cc` and `c++` here are
  # what a FreeBSD user compiles with. Fortran has to come from a package, and it
  # has to be gfortran: no llvm port builds flang, `FLANG` being in
  # `OPTIONS_DEFINE` and in no `OPTIONS_DEFAULT` for devel/llvm20 through
  # llvm23 (its build wants ~10 GB per process), and there is no standalone flang
  # port, so no binary package has one. gfortran from the `gcc` metaport is what
  # FreeBSD's own ports tree compiles Fortran software with.
  #
  # So `clang+gfortran`, and the suite's variant key calls it
  # `mpich/gcc/freebsd/14/amd64`: that component is detected from mpif's own
  # `mpifort --version`, so it names the *Fortran* compiler, which is the one an
  # expected-failures list of Fortran tests is about. Two things follow from the
  # key and are worth knowing before reading a failure here:
  # - `amd64` is FreeBSD's own word for what Linux and macOS call x86_64, so the
  #   per-architecture rows of that list match nothing here, and the ones that are
  #   really about 64-bit-ness need an amd64 twin when this variant is triaged.
  # - Until then it has no `triaged` line, so the suite reports its differences
  #   and cannot fail the run, which is how a platform nobody has measured
  #   arrives.
  #
  # MPICH only. Open MPI refuses to run as root without --allow-run-as-root, and
  # the action's `run` block is root (measured: `$HOME` is /root), so covering it
  # would mean passing that flag everywhere on one platform alone.
  freebsd:
    name: mpich / clang+gfortran / freebsd (VM)
    runs-on: ubuntu-24.04
    # Generous, this one having no MPI cache (see below) and running everything
    # inside a VM. Measured on the first run: 90 seconds to boot the VM and
    # install the packages, then six and a half minutes for MPICH from source
    # (`autogen.sh` included), mpif, and building all of test/ -- so the suite,
    # which that run never reached, is the only part whose cost is still unknown.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The release is pinned rather than left to the action's default, because
      # the major version is a component of the suite's variant key: a default
      # that moves would retire `.../freebsd/14/...` without anyone editing
      # anything, exactly as the `os:` list above is pinned so that a runner
      # image bump is somebody's decision.
      #
      # No MPI cache, deliberately. The three caches the `build` jobs keep live
      # on the host, and what is expensive here happens in the VM, whose
      # filesystem the host sees only through the synchronised workspace -- so
      # caching would mean building MPICH into the workspace and trusting a
      # round trip through rsync to preserve an installation of symlinks,
      # RPATHs and wrapper scripts. That is a lot of machinery to save a build
      # this job does once per run; it can be added if the run time becomes a
      # problem.
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          # The default shell is tcsh, which none of this is written in
          usesh: true
          # Nothing here produces an artifact the host wants, and mpif's two
          # build trees are hundreds of megabytes inside the workspace: without
          # this they would be rsync'ed back at the end of the job.
          copyback: false
          # Root-only work, and all of it: `run` below installs nothing.
          #
          # The `gcc` metaport is here for gfortran alone; C and C++ come from the
          # base system. python3 is for MPICH's `autogen.sh`, which the install
          # script runs because the patches it applies reach the binding
          # generators; curl, git, bash and gmake are not in the base system.
          #
          # The image's hostname is `freebsd` and nothing resolves it, which is
          # not a curiosity: MPICH's ch3:nemesis:tcp resolves the host's own name
          # to build the business card, so with more than one process every
          # MPI_Init dies with "GetSockInterfaceAddr(372): gethostbyname failed,
          # freebsd (errno 2)". That is measured -- it failed the 15 tests of
          # test/ that use two or more ranks, and passed the other 54, in the run
          # of 911f78f. Fixed at the root, by giving the name an address, rather
          # than by telling MPICH which interface to use: an MPI is entitled to
          # resolve the name the system gave it, the same would have had to be
          # said again for Open MPI or any other implementation, and provisioning
          # a VM we boot ourselves is not the same thing as papering over a
          # defect on a machine we found.
          prepare: |
            printf '127.0.0.1 %s\n' "$(hostname)" >>/etc/hosts
            pkg install -y \
                autoconf \
                automake \
                bash \
                cmake \
                curl \
                gcc \
                git \
                gmake \
                hwloc2 \
                libtool \
                perl5 \
                pkgconf \
                python3
          run: |
            set -e
            freebsd-version
            uname -a

            # Everything this job writes goes here, outside the checked-out
            # repository: the MPI source tree, the two prefixes, the suite's
            # tree and the shim below. Not for space -- the workspace is on the
            # same filesystem -- but because `install-mpich.sh` applies its
            # patches with `git apply`, and unpacking MPICH inside a git work
            # tree makes that a question about which repository it means. The
            # VM is thrown away either way, and `copyback: false` above means
            # nothing here would reach the host in any case.
            work=${HOME:-/tmp}/mpif-vm
            mkdir -p "${work}"

            # GNU make, ahead of FreeBSD's own on PATH. MPICH's build wants it,
            # and so does the suite: `runtests` shells out to `make` for every
            # test it builds, and nothing of ours is in between, so a MAKE
            # variable would reach the first and not the second. One symlink
            # covers both.
            shims=${work}/shims
            mkdir -p "${shims}"
            ln -sf /usr/local/bin/gmake "${shims}/make"
            PATH=${shims}:${PATH}
            export PATH
            make --version | head -1

            # C and C++ from the base system, which on FreeBSD is clang. `cc`
            # and `c++` rather than `clang` and `clang++`, because those are the
            # names the platform guarantees.
            CC=cc
            CXX=c++

            # Fortran from the package, and gfortran because there is no
            # packaged flang; see the comment on this job. The `gcc` metaport
            # installs `gfortran` as a symlink to whichever version is current
            # and `gfortran14` beside it, so find the compiler rather than
            # pinning a version here that pkg would outgrow without saying so.
            # Kept a bare name, as in the jobs above, so that the wrapper
            # compilers MPICH and mpif install do not record a path.
            FC=""
            for candidate in /usr/local/bin/gfortran /usr/local/bin/gfortran[0-9]*; do
                if [ -x "${candidate}" ]; then
                    FC=${candidate##*/}
                    break
                fi
            done
            if [ -z "${FC}" ]; then
                echo "no gfortran in /usr/local/bin" >&2
                exit 1
            fi
            export CC CXX FC
            ${CC} --version | head -1
            ${FC} --version | head -1

            MPI_PREFIX=${work}/opt/mpi-mpich
            MPIF_PREFIX=${work}/opt/mpif-mpich
            MPI_SRC_DIR=${work}/mpi-src
            # pkg installs into /usr/local, which is not a compiler's default
            # include path on FreeBSD
            HWLOC_PREFIX=/usr/local
            export MPI_SRC_DIR HWLOC_PREFIX

            bash ci-scripts/install-mpich.sh "${MPI_PREFIX}"

            PATH=${MPI_PREFIX}/bin:${PATH}
            LD_LIBRARY_PATH=${MPI_PREFIX}/lib
            export PATH LD_LIBRARY_PATH

            cmake \
                -Bbuild \
                -DBUILD_SHARED_LIBS=ON \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER="${CC}" \
                -DCMAKE_Fortran_COMPILER="${FC}" \
                -DCMAKE_INSTALL_PREFIX="${MPIF_PREFIX}" \
                -DMPI_HOME="${MPI_PREFIX}"
            cmake --build build --parallel
            cmake --install build

            # As in the `build` job: what the tests build and run against is the
            # default the mpif installation remembers, read back from the
            # installed wrapper rather than respecified.
            mpi_prefix=$("${MPIF_PREFIX}/bin/mpifort" -showme:mpiprefix)
            cmake \
                -Stest \
                -Bbuild-tests \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER="${CC}" \
                -DCMAKE_Fortran_COMPILER="${FC}" \
                -DMPI_C_COMPILER="${mpi_prefix}/bin/mpicc" \
                -DMPI_Fortran_COMPILER="${MPIF_PREFIX}/bin/mpifort" \
                -DMPI_C_HEADER_DIR="${mpi_prefix}/include" \
                -DMPI_C_LIB_NAMES=mpi_abi \
                -DMPI_mpi_abi_LIBRARY="${mpi_prefix}/lib/libmpi_abi.so" \
                -DMPIEXEC_EXECUTABLE="${mpi_prefix}/bin/mpiexec" \
                -DMPIF_TEST_MPI_LIBRARY=MPICH
            cmake --build build-tests --parallel
            ctest --test-dir build-tests --output-on-failure

            # No MPIR_CVAR_NEMESIS_TCP_NETWORK_IFACE here, unlike
            # scripts/macos-test-mpich-suite.sh: the `/etc/hosts` line in
            # `prepare` gives the host's own name an address, so the business
            # card a spawned child connects back to is 127.0.0.1 and the
            # loopback is what MPICH picks anyway. On that machine the name
            # resolves to a *different* host, which is not ours to fix, hence
            # the CVAR there and not here.
            MPICH_TESTS_DIR=${work}/tests
            export MPICH_TESTS_DIR
            bash ci-scripts/suite/test-mpich-suite.sh \
                "${mpi_prefix}" "${MPIF_PREFIX}"
