name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.mpi }} / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        mpi: [mpich, openmpi]
        toolchain: [gcc, llvm]
        include:
          - toolchain: gcc
            cc: gcc
            cxx: g++
            fc: gfortran
          - toolchain: llvm
            cc: clang-21
            cxx: clang++-21
            fc: flang-21

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
      # Suffix of shared libraries; `dylib` once macOS runners are added
      SHLIB_EXT: ${{ startsWith(matrix.os, 'macos') && 'dylib' || 'so' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up paths
        run: |
          echo "MPI_PREFIX=${RUNNER_TEMP}/opt/mpi" >>"${GITHUB_ENV}"
          echo "MPIF_PREFIX=${RUNNER_TEMP}/opt/mpif" >>"${GITHUB_ENV}"

      - name: Install dependencies (GCC)
        if: runner.os == 'Linux' && matrix.toolchain == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              autoconf \
              automake \
              cmake \
              gfortran \
              libhwloc-dev \
              libtool \
              pkg-config

      - name: Install dependencies (LLVM)
        if: runner.os == 'Linux' && matrix.toolchain == 'llvm'
        run: |
          curl -fsSLO https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y \
              autoconf \
              automake \
              clang-21 \
              cmake \
              flang-21 \
              libc++-21-dev \
              libc++abi-21-dev \
              libhwloc-dev \
              libomp-21-dev \
              libtool \
              lld-21 \
              llvm-21 \
              pkg-config

      # The build recipe lives entirely in `scripts/` and `fortran/`, so editing
      # this workflow does not invalidate the cache -- but changing the ABI
      # bindings, the patches, or the build scripts does.
      - name: Cache MPI installation
        id: cache-mpi
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/opt/mpi
          key: ${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-${{ hashFiles('scripts/install-*.sh', 'scripts/prune-install.sh', 'scripts/*-prune.txt', 'fortran/**') }}

      - name: Build and install ${{ matrix.mpi }}
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        run: scripts/install-${{ matrix.mpi }}.sh "${MPI_PREFIX}"

      - name: Add MPI to the environment
        run: |
          echo "${MPI_PREFIX}/bin" >>"${GITHUB_PATH}"
          echo "LD_LIBRARY_PATH=${MPI_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >>"${GITHUB_ENV}"

      - name: Configure, build, and install mpif
        run: |
          cmake \
              -Bbuild \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DCMAKE_INSTALL_PREFIX="${MPIF_PREFIX}" \
              -DMPI_HOME="${MPI_PREFIX}"
          cmake --build build --parallel
          cmake --install build

      - name: Configure, build, and run tests
        run: |
          cd test
          cmake \
              -Bbuild-tests \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DMPI_C_COMPILER="${MPI_PREFIX}/bin/mpicc" \
              -DMPI_Fortran_COMPILER="${MPIF_PREFIX}/bin/mpifort" \
              -DMPI_C_HEADER_DIR="${MPI_PREFIX}/include" \
              -DMPI_C_LIB_NAMES=mpi_abi \
              -DMPI_mpi_abi_LIBRARY="${MPI_PREFIX}/lib/libmpi_abi.${SHLIB_EXT}"
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure
