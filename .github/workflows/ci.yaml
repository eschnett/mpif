name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Everything that needs no MPI, no compiler and no build, so it runs once
  # rather than once per variant and answers in seconds. Not a dependency of the
  # jobs below: it would delay all of them by a runner start-up for a check that
  # takes a moment, and a failure here fails the run either way.
  checks:
    name: source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Each sentinel is a COMMON block whose storage src/mpif_constants.c
      # defines, and a wrapper recognises one by comparing the address it was
      # handed against that storage. Rename either side alone and the two stop
      # being the same object: the compare never matches, the sentinel goes to
      # MPI as an ordinary buffer, and nothing warns. This catches it without a
      # build; mpif_check_environment catches it at run time.
      - name: Check the sentinel common blocks against their C definitions
        run: bash ci-scripts/check-headers.sh

      # The variant matrix is written out once per stage below, and the stages
      # only line up if the lists agree. They are not decoration: the suite's
      # expected-failure list is keyed on <mpi>/<toolchain>/<os>/<os-version>/
      # <arch>, so a stage whose `os:` list has drifted gates against a different
      # row -- or, worse, uploads artifacts nothing consumes and loses coverage
      # with nothing failing. mpich-suite-xfail.txt says these lists "pin the
      # images, so this happens when someone edits that list and not behind their
      # back", and with five copies that is only true if something checks.
      #
      # Inline rather than a script under ci-scripts/, which is hashed into the
      # MPI installation cache key: a check that costs twelve MPI rebuilds to edit
      # is a check nobody edits.
      - name: Check that the stages agree on the variant matrix
        run: |
          axis() {
              yq -o=json -I0 ".jobs.${1}.strategy.matrix.${2}" .github/workflows/ci.yaml
          }
          same() {
              local axis=$1 reference=$2 job value
              shift 2
              for job in "$@"; do
                  value=$(axis "${job}" "${axis}")
                  echo "  ${job}.${axis} = ${value}"
                  if [[ ${value} != "$(axis "${reference}" "${axis}")" ]]; then
                      echo "::error::the ${job} stage's ${axis} axis differs from" \
                           "the ${reference} stage's"
                      return 1
                  fi
              done
          }
          # Every stage runs on every (os, toolchain) -- except sanitize, which
          # is deliberately one os and one implementation and so has neither axis
          same os        mpi mpif suite cross compare
          same toolchain mpi mpif suite cross compare sanitize
          # ... and the three per-implementation stages on every implementation
          same mpi mpi mpif suite
          # `cross` has no `mpi:` axis. It has `built:`, one leg per direction,
          # which has to cover the same implementations
          echo "  cross.built = $(axis cross built)"
          test "$(axis cross built)" = "$(axis mpi mpi)"
          # and each direction's runtime must be the *other* implementation
          directions=$(yq -o=json -I0 \
              '[.jobs.cross.strategy.matrix.include[] | .built + " run " + .run]' \
              .github/workflows/ci.yaml)
          echo "  cross directions = ${directions}"
          test "${directions}" = '["mpich run openmpi","openmpi run mpich"]'

  # Compilers beyond the two the rest of this file exercises: does mpif's
  # configure stage detect their features correctly, and does the code compile.
  # Nothing here runs anything, which is deliberate -- behaviour is what the
  # twelve variants below are for, and asking for it would put an MPI build
  # and a suite triage behind every compiler added.
  #
  # It needs no MPI. ci-scripts/install-mpi-stubs.sh builds the Forum's ABI stub
  # library, whose every entry point aborts, and that is enough: it satisfies
  # find_package(MPI) and the libmpi_abi assertion, and mpif's library links no
  # MPI at all. So a row costs a runner and about five minutes, with no cache,
  # no artifact and no dependency on the jobs below -- and the old-gfortran rows
  # can be plain containers, because nothing has to match the runner's libc.
  #
  # Every row builds both halves of the CFI decision; ci-scripts/compile-only.sh
  # says why. A row gates once it has been green, and until then is
  # `report_only` with the reason beside it and an entry in MISSING.md -- the
  # rule CLAUDE.md states for an untriaged suite variant, applied to a compiler.
  # The one that reports rather than gates is a compiler defect with nothing for
  # mpif to change; it is measured and written up.
  #
  # The gfortran row is an official `gcc:<n>` image rather than a Debian
  # release, so the image name is the compiler version with nothing to look up;
  # it carries git and curl but no CMake, which the step below fetches. One
  # version standing for the old ones: 7 through 12 were each measured locally
  # and all compile mpif, both branches, and 13 and 15 are covered by `mpif`.
  # 7 compiling is why the floor is not a row -- it is the ABI floor in
  # MISSING.md's "bind(C)" (hidden character lengths were `int` before 8), which
  # a stage that compiles and does not run cannot see, so a green there would
  # say nothing.
  #
  # The three vendor rows are x86-64 only, and use each vendor's own C compiler
  # beside its Fortran one, which is both what their users do and the case where
  # the C compiler can find ISO_Fortran_binding.h unaided.
  compile:
    name: compile / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.report_only }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gfortran-9
            container: gcc:9
            report_only: false
          - name: amdflang
            container: ""
            report_only: false
          # MISSING.md "`ifx` aborts on a sentinel passed as an assumed-rank
          # actual": an internal compiler error on both branches, at the first
          # sentinel reaching a choice buffer. The library itself builds.
          - name: ifx
            container: ""
            report_only: true
          # Green since three of its defects were worked around; MISSING.md has
          # them. It answers no to the TS 29113 probe, so this row compiles the
          # ignore_tkr fallback twice and the scheme-1B path never -- the one
          # green here that means less than the others.
          - name: nvfortran
            container: ""
            report_only: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The gcc images ship no CMake, and the older ones are built on Debian
      # releases whose apt archives have moved. An official binary avoids both.
      - name: Install CMake (containers)
        if: matrix.container != ''
        run: |
          version=3.31.6
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${version}/cmake-${version}-linux-$(uname -m).tar.gz" \
              | tar xz -C /opt
          echo "/opt/cmake-${version}-linux-$(uname -m)/bin" >>"${GITHUB_PATH}"

      - name: Select the compilers (containers)
        if: matrix.container != ''
        run: |
          {
              echo "CC=gcc"
              echo "FC=gfortran"
          } >>"${GITHUB_ENV}"

      # Intel's oneAPI compilers come from Intel's own apt repository. The
      # Fortran package brings ifx; the dpcpp-cpp one brings icx, and the
      # environment they need comes from setvars.sh rather than from PATH alone.
      - name: Install the Intel oneAPI compilers
        if: matrix.name == 'ifx'
        run: |
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
              | sudo gpg --dearmor -o /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
              | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y cmake \
              intel-oneapi-compiler-fortran intel-oneapi-compiler-dpcpp-cpp
          set +u
          source /opt/intel/oneapi/setvars.sh
          set -u
          {
              echo "CC=icx"
              echo "FC=ifx"
              echo "PATH=${PATH}"
              echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
          } >>"${GITHUB_ENV}"

      # NVHPC is several GB, so the runner's preinstalled toolchains go first.
      # The package name carries the release, which would rot if written down --
      # so the newest one the repository offers is what gets installed, and the
      # step prints it.
      - name: Install the NVIDIA HPC SDK
        if: matrix.name == 'nvfortran'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          curl -fsSL https://developer.download.nvidia.com/hpc-sdk/ubuntu/DEB-GPG-KEY-NVIDIA-HPC-SDK \
              | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/nvidia-hpcsdk-archive-keyring.gpg] https://developer.download.nvidia.com/hpc-sdk/ubuntu/amd64 /' \
              | sudo tee /etc/apt/sources.list.d/nvhpc.list
          sudo apt-get update
          package=$(apt-cache search --names-only '^nvhpc-[0-9]+-[0-9]+$' \
              | cut -d' ' -f1 | sort -V | tail -1)
          echo "installing ${package}"
          sudo apt-get install -y cmake "${package}"
          bindir=$(dirname "$(find /opt/nvidia/hpc_sdk -name nvfortran -type f \
              -path '*/compilers/bin/*' | sort -V | tail -1)")
          {
              echo "CC=${bindir}/nvc"
              echo "FC=${bindir}/nvfortran"
          } >>"${GITHUB_ENV}"

      # AMD's Fortran compiler as ROCm ships it. AOCC is the other AMD compiler
      # and is not here: its download is behind a licence form, so it cannot be
      # installed unattended -- see MISSING.md.
      - name: Install the AMD ROCm compilers
        if: matrix.name == 'amdflang'
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.radeon.com/rocm/rocm.gpg.key \
              | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest noble main" \
              | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y cmake rocm-llvm
          {
              echo "CC=/opt/rocm/llvm/bin/amdclang"
              echo "FC=/opt/rocm/llvm/bin/amdflang"
          } >>"${GITHUB_ENV}"

      - name: Configure, build and install mpif, both CFI branches
        run: bash ci-scripts/compile-only.sh "${RUNNER_TEMP}/compile-only"

      # The probes are printed by the step above; this is what a failure needs.
      - name: Dump the CMake logs
        if: failure()
        run: |
          for branch in default no-cfi; do
              dir=${RUNNER_TEMP}/compile-only/build-${branch}/CMakeFiles
              cat "${dir}/CMakeConfigureLog.yaml" 2>/dev/null || true
              cat "${dir}/CMakeError.log" 2>/dev/null || true
          done

  # Stage one: an MPI installation per variant, and nothing else. Everything
  # below needs one, nothing below can change one, and it is much the most
  # expensive thing here -- five to sixteen minutes from source against two
  # seconds from the cache. Giving it a job of its own is what lets the jobs that
  # consume it start when it is ready rather than when a suite run that happened
  # to share its job has finished.
  #
  # It is also the right unit to cache. actions/cache saves in a post step
  # declared `post-if: success()`, so while this was one job with the tests, a
  # test failure or a triaged suite difference on a cache miss discarded the MPI
  # that had just been built, and the next push rebuilt it. The predicate is now
  # exactly "the MPI installed and check-mpi-install.sh passed".
  mpi:
    name: mpi / ${{ matrix.mpi }} / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # The runner label carries the architecture, so another architecture is
        # just another entry in `os`. Everything downstream already adapts at run
        # time: `brew --prefix` finds Homebrew wherever it lives, SHLIB_EXT
        # follows from the label, and the compilers are chosen from RUNNER_OS.
        #
        # x86-64 is covered on Linux only, deliberately. The free Intel macOS
        # images have been retired and `macos-15-intel` is not a valid label, so
        # x86-64 macOS would mean a larger runner, which is billed even for
        # public repositories.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        mpi: [mpich, openmpi]
        toolchain: [gcc, llvm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set here rather than in the job's `env:`, because the `runner` context
      # is not available there. The prefix carries the implementation's name --
      # opt/mpi-mpich, not opt/mpi -- because the cross job below restores both
      # implementations' prefixes onto one runner, at the exact absolute paths
      # everything baked at install time (wrapper defaults, RPATHs, macOS install
      # names), and those paths must not collide. One implementation per job here
      # does not make opt/mpi sufficient, and renaming it would cost another
      # cache-key bump; MISSING.md records what the last one cost.
      - name: Set up paths
        run: |
          {
              echo "MPI_PREFIX=${RUNNER_TEMP}/opt/mpi-${{ matrix.mpi }}"
              echo "MPI_SRC_DIR=${RUNNER_TEMP}/mpi-src"
          } >>"${GITHUB_ENV}"

      # This is the only job that builds an MPI from source, so it is the only
      # one that asks for autotools and for ccache.
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
          autotools: "true"
          ccache: "true"

      # Three caches, from coarsest to finest. The MPI installation is all that
      # is needed for a run that changes neither the bindings nor the build
      # scripts; the other two only come into play when it misses.
      #
      # What building and installing an MPI reads, and nothing else: everything in
      # `ci-scripts/` except `ci-scripts/suite/`, which is read only after the MPI
      # exists and cannot change it, and except the README, which nothing reads.
      # Hashing the suite too meant one triaged suite failure rebuilt MPI on all
      # twelve variants.
      #
      # The exclusions are why this is not simply `ci-scripts/*`. That pattern
      # matches the *directory* `ci-scripts/suite`, and `@actions/glob` expands a
      # matched directory to all of its descendants -- `implicitDescendants`
      # defaults to true -- so the single `*` excluded nothing and the suite's files
      # stayed in the key. That was measured, not guessed: the hash the caches
      # carried is reproduced exactly by hashing `ci-scripts/*` with the suite's
      # three files included, 19 files rather than 16.
      #
      # Patterns rather than a list of filenames, so that a new install input is
      # covered without an edit here; `ci-scripts/README.md` has the rest of the
      # reasoning.
      # The `mpi2-` key prefix (previously `mpi-`) is deliberate: actions/cache
      # restores an archive to the absolute paths recorded when it was saved, so
      # a cache saved under the old opt/mpi path would restore *there* while
      # this job expects opt/mpi-<implementation>, and the mismatch would look
      # like a broken installation rather than a stale cache.
      - name: Cache MPI installation
        id: cache-mpi
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/opt/mpi-${{ matrix.mpi }}
          key: mpi2-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-${{ hashFiles('ci-scripts/**', '!ci-scripts/suite/**', '!ci-scripts/README.md', 'fortran/**') }}

      # The downloaded and autogen'ed source tree. Its key deliberately ignores
      # `fortran/`, so editing the bindings still skips the clone, the
      # submodules and `autogen`. It does cover the patches the install scripts
      # apply, which are part of the prepared tree. Saved explicitly right after
      # preparing it, because by the end of the job the tree also holds all the
      # build output.
      - name: Restore MPI source tree
        id: cache-mpi-src
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/mpi-src
          key: mpi-src-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-${{ hashFiles('ci-scripts/install-*.sh', 'ci-scripts/*.patch') }}

      - name: Prepare MPI source tree
        if: steps.cache-mpi.outputs.cache-hit != 'true' && steps.cache-mpi-src.outputs.cache-hit != 'true'
        env:
          MPI_PREPARE_ONLY: 1
        run: ci-scripts/install-${{ matrix.mpi }}.sh

      - name: Save MPI source tree
        if: steps.cache-mpi.outputs.cache-hit != 'true' && steps.cache-mpi-src.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/mpi-src
          key: ${{ steps.cache-mpi-src.outputs.cache-primary-key }}

      # Compiler cache, so that a change to the bindings recompiles only what
      # actually changed. Restored from whatever the most recent run left, and
      # saved under a fresh key because caches are immutable.
      - name: Restore ccache
        id: cache-ccache
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}-

      - name: Build and install ${{ matrix.mpi }}
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        run: |
          ccache --zero-stats
          ci-scripts/install-${{ matrix.mpi }}.sh "${MPI_PREFIX}"
          ccache --show-stats

      - name: Save ccache
        if: steps.cache-mpi.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      - name: Add MPI to the environment
        run: |
          echo "${MPI_PREFIX}/bin" >>"${GITHUB_PATH}"
          if [[ ${RUNNER_OS} == Linux ]]; then
              echo "LD_LIBRARY_PATH=${MPI_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >>"${GITHUB_ENV}"
          fi
          # macOS needs no equivalent: the libraries carry an `@rpath`
          # install name, and the executables an rpath pointing at them.

      # The install scripts run this too, but not when the installation came
      # from the cache -- and its output is what diagnoses a broken one.
      - name: Check the MPI installation
        run: ci-scripts/check-mpi-install.sh "${MPI_PREFIX}"

      - name: Upload the MPI prefix
        uses: ./.github/actions/upload-prefix
        with:
          name: mpi-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}
          path: opt/mpi-${{ matrix.mpi }}
          cache: ${{ steps.cache-mpi.outputs.cache-hit == 'true' && 'hit' || 'miss' }}

  # Stage two: mpif itself, and test/ -- mpif's own tests, small and fast, whose
  # job is to say whether this installation works at all before the broad ones
  # spend ten minutes on it. What comes out is the installed prefix, which is
  # what every job below consumes; nothing below rebuilds mpif.
  #
  # `if: ${{ !cancelled() }}` rather than the default `needs` semantics, here and
  # in every stage below. Otherwise one failing MPI installation would skip all
  # twelve legs of all four stages and the run would say nothing about the other
  # eleven variants. With it, the legs whose artifact is missing fail by name --
  # restore-prefix downloads by `name:`, which throws -- and the rest report.
  # Not `always()`, which would also run these on cancellation and fight
  # `cancel-in-progress` above.
  mpif:
    name: mpif / ${{ matrix.mpi }} / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: mpi
    if: ${{ !cancelled() }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        mpi: [mpich, openmpi]
        toolchain: [gcc, llvm]

    env:
      # Suffix of shared libraries
      SHLIB_EXT: ${{ startsWith(matrix.os, 'macos') && 'dylib' || 'so' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up paths
        run: |
          {
              echo "MPI_PREFIX=${RUNNER_TEMP}/opt/mpi-${{ matrix.mpi }}"
              echo "MPIF_PREFIX=${RUNNER_TEMP}/opt/mpif-${{ matrix.mpi }}"
          } >>"${GITHUB_ENV}"

      # Before the toolchain, so that a leg whose MPI installation failed costs
      # fifteen seconds rather than a minute of `apt-get install`. Nothing about
      # an MPI prefix needs a compiler to unpack or to check.
      - name: Restore the MPI prefix
        uses: ./.github/actions/restore-prefix
        with:
          name: mpi-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}

      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Add MPI to the environment
        run: |
          echo "${MPI_PREFIX}/bin" >>"${GITHUB_PATH}"
          if [[ ${RUNNER_OS} == Linux ]]; then
              echo "LD_LIBRARY_PATH=${MPI_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >>"${GITHUB_ENV}"
          fi

      # A prefix that arrived over an artifact rather than out of the install
      # script's own hands, so it is checked again here -- and its output is what
      # diagnoses a broken one.
      - name: Check the MPI installation
        run: ci-scripts/check-mpi-install.sh "${MPI_PREFIX}"

      - name: Configure, build, and install mpif
        run: |
          cmake \
              -Bbuild \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DCMAKE_INSTALL_PREFIX="${MPIF_PREFIX}" \
              -DMPI_HOME="${MPI_PREFIX}"
          cmake --build build --parallel
          cmake --install build

      # The MPI these tests run against is the one mpif was built against, which
      # in this job is also the one it remembers.
      - name: Work out the launcher flags
        uses: ./.github/actions/mpiexec-flags
        with:
          mpi: ${{ matrix.mpi }}

      - name: Configure, build, and run tests
        run: |
          # The MPI these tests build and run against is the *default the mpif
          # installation remembers*, read back from the installed wrapper
          # rather than respecified as ${MPI_PREFIX}: what is under test is
          # what the installation would give a user. In this job the two are
          # the same directory; the cross job below is where they differ.
          mpi_prefix=$("${MPIF_PREFIX}/bin/mpifort" -showme:mpiprefix)
          #
          # The alltoallw tests need more than one rank, so they need a launcher.
          # It is pinned rather than detected: `find_package(MPI)` picks mpiexec
          # off the PATH, and while the step above puts the MPI's bin first,
          # depending on that order is how a run ends up testing mpif against an
          # MPI it was not built against. test/CMakeLists.txt fails the configure
          # if this is missing.
          #
          # MPICH wants no preflags at all rather than an empty list, which is why
          # this is a guard and not an unconditional -D.
          cmake_args=()
          if [[ -n ${MPIEXEC_PREFLAGS:-} ]]; then
              cmake_args+=("-DMPIEXEC_PREFLAGS=${MPIEXEC_PREFLAGS}")
          fi
          cmake \
              -Stest \
              -Bbuild-tests \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DMPI_C_COMPILER="${mpi_prefix}/bin/mpicc" \
              -DMPI_Fortran_COMPILER="${MPIF_PREFIX}/bin/mpifort" \
              -DMPI_C_HEADER_DIR="${mpi_prefix}/include" \
              -DMPI_C_LIB_NAMES=mpi_abi \
              -DMPI_mpi_abi_LIBRARY="${mpi_prefix}/lib/libmpi_abi.${SHLIB_EXT}" \
              -DMPIEXEC_EXECUTABLE="${mpi_prefix}/bin/mpiexec" \
              -DMPIF_TEST_MPI_LIBRARY="${MPIF_TEST_MPI_LIBRARY}" \
              "${cmake_args[@]}"
          cmake --build build-tests --parallel
          ctest --test-dir build-tests --output-on-failure

      # Hand the installation to the jobs below. Separately from the MPI prefix,
      # which they get from the `mpi` job: sanitize wants only the MPI, compare
      # wants only the two mpifs, and a cross leg wants one mpif and both MPIs.
      - name: Upload the mpif prefix
        uses: ./.github/actions/upload-prefix
        with:
          name: mpif-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}
          path: opt/mpif-${{ matrix.mpi }}

      # CMake keeps the compiler and linker output of its own checks -- such as
      # the one behind `missing: MPI_C_WORKS` -- in these files, and reports
      # only the conclusion on the console.
      - name: Show CMake's check logs
        if: failure()
        run: |
          for dir in build build-tests; do
              for log in "${dir}"/CMakeFiles/CMakeConfigureLog.yaml \
                         "${dir}"/CMakeFiles/CMakeError.log; do
                  if [[ -f ${log} ]]; then
                      echo "::group::${log}"
                      cat "${log}"
                      echo "::endgroup::"
                  fi
              done
          done

  # MPICH's own suite has ~300 Fortran tests across mpif.h, `use mpi` and
  # `use mpi_f08`, and disables all of them for the standard ABI because the ABI
  # has no Fortran bindings -- which is what mpif supplies. Far broader coverage
  # than test/, so worth running even before every test passes. The failures that
  # are expected are listed in ci-scripts/suite/mpich-suite-xfail.txt with a
  # reason apiece, and the run fails on a difference from that list rather than on
  # a failure -- in either direction, so a test that starts passing is caught too.
  # A variant with no `triaged` line there is reported and cannot fail, which is
  # how the variants nobody has measured yet stay honest.
  #
  # Its own job rather than the tail of `mpif`, because it is the longest thing
  # here -- five to eleven minutes a leg -- and nothing waits on its result.
  # Sharing a job with mpif put it in front of every cross leg, for no reason
  # other than that the two happened to be neighbours.
  suite:
    name: suite / ${{ matrix.mpi }} / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: mpif
    if: ${{ !cancelled() }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        mpi: [mpich, openmpi]
        toolchain: [gcc, llvm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up paths
        run: |
          {
              echo "MPI_PREFIX=${RUNNER_TEMP}/opt/mpi-${{ matrix.mpi }}"
              echo "MPIF_PREFIX=${RUNNER_TEMP}/opt/mpif-${{ matrix.mpi }}"
          } >>"${GITHUB_ENV}"

      - name: Restore the MPI prefix
        uses: ./.github/actions/restore-prefix
        with:
          name: mpi-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}

      # The suite recompiles every one of its tests, in Fortran, against the
      # restored mpif's modules -- which is why this restore checks the compiler.
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Restore the mpif prefix
        uses: ./.github/actions/restore-prefix
        with:
          name: mpif-${{ matrix.mpi }}-${{ matrix.toolchain }}-${{ matrix.os }}
          check-fortran: "true"

      - name: Add MPI to the environment
        run: |
          echo "${MPI_PREFIX}/bin" >>"${GITHUB_PATH}"
          if [[ ${RUNNER_OS} == Linux ]]; then
              echo "LD_LIBRARY_PATH=${MPI_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >>"${GITHUB_ENV}"
          fi

      - name: Work out the launcher flags
        uses: ./.github/actions/mpiexec-flags
        with:
          mpi: ${{ matrix.mpi }}

      - name: Run MPICH's Fortran test suite
        run: |
          # The runtime MPI is the installation's remembered default, read back
          # from the installed wrapper rather than respecified as ${MPI_PREFIX}:
          # what is under test is what the installation would give a user. Here
          # the two are the same directory; the cross job below is where they
          # differ. MPIEXEC_ARGS comes from the step above, and is unset for
          # MPICH, which the script itself guards for.
          ci-scripts/suite/test-mpich-suite.sh \
              "$("${MPIF_PREFIX}/bin/mpifort" -showme:mpiprefix)" "${MPIF_PREFIX}"

  # A sanitizer build of mpif, on the MPI the `mpi` jobs already installed.
  #
  # What it adds is a diagnosis. A memory error in mpif's own conversion layer
  # -- which allocates, copies strings both directions and walks handle arrays
  # whose length it works out itself -- becomes a report naming the file, the
  # line and the Fortran caller, instead of a corrupted MPI several calls later.
  # That is measured, not hoped for: a one-byte heap overflow put back into
  # mpif_strdup_f2c_trim failed info_get_string_f08 with all four frames under
  # a sanitizer build, and passed all 69 tests under an ordinary one. Both
  # memory defects this project has fixed there were pinned down by hand with an
  # mmap'ed guard page, before this existed. See "Sanitizer builds" in CODE.md.
  #
  # One mpi and one os, but both toolchains, because the toolchains are two
  # different mechanisms rather than two compilers: gfortran has a -fsanitize of
  # its own and instruments the Fortran too, while flang has none as of LLVM 22,
  # so there the C is instrumented and the runtime has to be named on the
  # Fortran link line by hand. Each is exercised only here. The implementations
  # and the operating systems are not a second axis worth paying for -- mpif's C
  # is the same object code whichever MPI is loaded next to it, and it links no
  # MPI at all (see "Choosing the MPI at run time" in CODE.md).
  #
  # It takes the MPI prefix from the `mpi` job's artifact rather than installing
  # one, the way `cross` does, so this job costs a runner and not an MPI build.
  # That is also all it takes: it installs its own instrumented mpif, so it waits
  # on stage one alone and not on any test run.
  sanitize:
    name: sanitize / ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    needs: mpi
    if: ${{ !cancelled() }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, llvm]

    env:
      # LeakSanitizer is on by default under Linux, and what it would report is
      # the MPI's own allocations surviving MPI_Finalize -- seen from an
      # instrumented process standing next to an uninstrumented library, which
      # is this job's whole arrangement. ASAN_OPTIONS=detect_leaks=1 is how to
      # ask the question anyway, knowing what else is in the answer.
      ASAN_OPTIONS: detect_leaks=0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The MPI prefix at the exact absolute path the `mpi` job installed it at,
      # so its wrappers, RPATHs and baked defaults are valid again. Before the
      # toolchain, as everywhere else: unpacking and checking an MPI prefix needs
      # no compiler.
      - name: Restore the MPI prefix
        uses: ./.github/actions/restore-prefix
        with:
          name: mpi-mpich-${{ matrix.toolchain }}-ubuntu-24.04

      # Only what compiles mpif and test/: nothing here builds an MPI, so no
      # autotools and no ccache. Same versions as the mpif and cross jobs, the
      # restored prefix's wrappers naming these compilers bare.
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Set up paths
        run: |
          # Set here and not in the job's `env:`, which cannot see the
          # `runner` context -- the same reason the `mpi` job has a "Set up
          # paths" step.
          echo "MPI_PREFIX=${RUNNER_TEMP}/opt/mpi-mpich" >>"${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/opt/mpi-mpich/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >>"${GITHUB_ENV}"

      - name: Check the MPI installation
        run: ci-scripts/check-mpi-install.sh "${MPI_PREFIX}"

      - name: Configure, build, and install mpif with AddressSanitizer
        run: |
          cmake \
              -Bbuild-asan \
              -DBUILD_SHARED_LIBS=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/opt/mpif-mpich-asan" \
              -DMPI_HOME="${MPI_PREFIX}" \
              -DMPIF_SANITIZE=address
          cmake --build build-asan --parallel
          cmake --install build-asan

      # A sanitizer build whose flags never reached the compiler works, and
      # passes all 69 tests, which is exactly what a correct one does on clean
      # code -- no test can tell the two apart. This reads the object code.
      - name: Check that the library is really instrumented
        run: ci-scripts/check-sanitizer-build.sh "${RUNNER_TEMP}/opt/mpif-mpich-asan"

      - name: Build and run test/ against the sanitizer mpif
        run: |
          asan_prefix=${RUNNER_TEMP}/opt/mpif-mpich-asan
          cmake \
              -Stest \
              -Bbuild-asan-tests \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DMPI_C_COMPILER="${MPI_PREFIX}/bin/mpicc" \
              -DMPI_Fortran_COMPILER="${asan_prefix}/bin/mpifort" \
              -DMPI_C_HEADER_DIR="${MPI_PREFIX}/include" \
              -DMPI_C_LIB_NAMES=mpi_abi \
              -DMPI_mpi_abi_LIBRARY="${MPI_PREFIX}/lib/libmpi_abi.so" \
              -DMPIEXEC_EXECUTABLE="${MPI_PREFIX}/bin/mpiexec" \
              -DMPIF_TEST_MPI_LIBRARY=MPICH
          cmake --build build-asan-tests --parallel
          ctest --test-dir build-asan-tests --output-on-failure

      # FindMPI suppresses the compile and link output of its own probes -- a
      # bare "missing: MPI_Fortran_WORKS" is all the console gets -- and the
      # detail goes here. The `mpif` job carries the same step for the same
      # reason.
      - name: Show CMake's check logs
        if: failure()
        run: |
          for dir in build-asan build-asan-tests; do
              for log in "${dir}"/CMakeFiles/CMakeConfigureLog.yaml \
                         "${dir}"/CMakeFiles/CMakeError.log; do
                  if [[ -f ${log} ]]; then
                      echo "::group::${log}"
                      cat "${log}"
                      echo "::endgroup::"
                  fi
              done
          done

  # The two mpif installations must not depend on the MPI they were built
  # against. The headers and modules must be identical outright. The library must
  # export and reference exactly the same symbols -- it links no MPI, so there is
  # nothing implementation-specific left to differ. Byte identity of the libraries
  # is reported but not (yet) required: it is expected, both jobs building
  # identical sources in identically named directories, but it has not been
  # measured across runners.
  #
  # Its own job rather than the first step of a cross run, because it needs no
  # compiler at all -- diff, nm and cmp -- and because a red leg then names the
  # assertion that broke. It still has to run on the matching runner: nm reads
  # the platform's own object format.
  compare:
    name: compare / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: mpif
    if: ${{ !cancelled() }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        toolchain: [gcc, llvm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # No `check-fortran`: this job installs no compiler and compiles nothing,
      # so it has no FC to compare against and no modules to be wrong about.
      - name: Restore the mpif built against MPICH
        uses: ./.github/actions/restore-prefix
        with:
          name: mpif-mpich-${{ matrix.toolchain }}-${{ matrix.os }}
      - name: Restore the mpif built against Open MPI
        uses: ./.github/actions/restore-prefix
        with:
          name: mpif-openmpi-${{ matrix.toolchain }}-${{ matrix.os }}

      - name: Compare the two mpif installations
        run: |
          a="${RUNNER_TEMP}/opt/mpif-mpich"
          b="${RUNNER_TEMP}/opt/mpif-openmpi"
          diff -r "${a}/include" "${b}/include"
          echo "include/ identical"
          if [[ ${RUNNER_OS} == macOS ]]; then
              liba=${a}/lib/libmpifort_abi.1.0.0.dylib
              libb=${b}/lib/libmpifort_abi.1.0.0.dylib
          else
              liba=${a}/lib/libmpifort_abi.so.1.0.0
              libb=${b}/lib/libmpifort_abi.so.1.0.0
          fi
          symbols() { nm -g "$1" | awk '{ print $(NF-1), $NF }' | sort; }
          diff <(symbols "${liba}") <(symbols "${libb}")
          echo "exported and undefined symbols identical"
          if cmp -s "${liba}" "${libb}"; then
              echo "the libraries are byte-identical"
          else
              echo "note: the libraries differ in their bytes (not required)"
          fi

  # The cross-implementation tests: mpif is built against the C MPI ABI, so a
  # build made against one implementation must work, unchanged, with the other --
  # the test results may depend only on the MPI it *runs* with, never on the MPI
  # it was *built* against. One leg per direction: mpif-built-against-MPICH under
  # Open MPI, and the mirror. Toolchains are never mixed -- gcc and llvm Fortran
  # are not ABI-compatible -- so a pairing varies only the MPI.
  #
  # One direction per job, where the two used to share one: they are independent
  # work, and running them in sequence made this the longest job in the pipeline
  # at 1075 seconds of suite on macOS. It also gives each leg a single runtime
  # MPI, known at job level, which is what lets the launcher flags come from a
  # step rather than from a branch inside a loop.
  #
  # Two models, on purpose:
  # - test/ swaps the runtime under unchanged binaries: everything is linked
  #   against the built mpif's default MPI, and LD_LIBRARY_PATH (macOS:
  #   DYLD_LIBRARY_PATH) puts the other implementation's libmpi_abi -- same
  #   conventional versioned name, libmpi_abi.so.1 -- in front of the rpath'd
  #   default at run time. That is the loader-level mechanism applications use,
  #   tested directly; MPIF_TEST_MPI_LIBRARY makes the tests assert the swap
  #   actually happened.
  # - the MPICH suite relinks against the runtime MPI (test-mpich-suite.sh
  #   exports MPIF_MPI_PREFIX from its first argument): its harness runs through
  #   the system perl and shells, from which macOS SIP strips DYLD_*, and it
  #   recompiles every test per run anyway. Its results are gated against the
  #   *runtime* MPI's rows of mpich-suite-xfail.txt -- the same rows as that MPI's
  #   native run, which is the "results depend only on the runtime MPI"
  #   assertion, enforced by the existing list without new keys. The variant key
  #   is detected, not passed: the implementation from the runtime prefix, the
  #   toolchain from mpif's own mpifort.
  cross:
    name: cross / ${{ matrix.built }}-run-${{ matrix.run }} / ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: mpif
    if: ${{ !cancelled() }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        toolchain: [gcc, llvm]
        built: [mpich, openmpi]
        # `run` is the other implementation. An include entry whose keys already
        # name an axis value merges into the combinations that match it, rather
        # than adding legs -- so this adds `run` to the six legs apiece and the
        # matrix stays twelve.
        include:
          - built: mpich
            run: openmpi
          - built: openmpi
            run: mpich

    env:
      SHLIB_EXT: ${{ startsWith(matrix.os, 'macos') && 'dylib' || 'so' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up paths
        run: |
          {
              echo "MPIF_PREFIX=${RUNNER_TEMP}/opt/mpif-${{ matrix.built }}"
              echo "RUN_PREFIX=${RUNNER_TEMP}/opt/mpi-${{ matrix.run }}"
          } >>"${GITHUB_ENV}"

      # Both MPIs, at the exact absolute paths they were installed at so that
      # every baked path -- wrapper defaults, RPATHs, macOS install names -- is
      # valid again: the one the tests run against, and the one mpif was built
      # against, which is still what its wrapper links against. One `name:`
      # apiece and never a `pattern:`; restore-prefix says why. These come before
      # the toolchain because unpacking and checking an MPI prefix needs no
      # compiler, so a leg whose upstream failed says so in fifteen seconds.
      - name: Restore the ${{ matrix.run }} prefix, the runtime
        uses: ./.github/actions/restore-prefix
        with:
          name: mpi-${{ matrix.run }}-${{ matrix.toolchain }}-${{ matrix.os }}
      - name: Restore the ${{ matrix.built }} prefix, what mpif links against
        uses: ./.github/actions/restore-prefix
        with:
          name: mpi-${{ matrix.built }}-${{ matrix.toolchain }}-${{ matrix.os }}

      # The same compilers as the mpif jobs, because this job compiles test/ and
      # the suite's Fortran side. No autotools and no ccache: nothing here builds
      # an MPI.
      - name: Set up the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Restore the mpif built against ${{ matrix.built }}
        uses: ./.github/actions/restore-prefix
        with:
          name: mpif-${{ matrix.built }}-${{ matrix.toolchain }}-${{ matrix.os }}
          check-fortran: "true"

      # The flags follow the MPI the tests *run* against, which is the one this
      # job varies.
      - name: Work out the launcher flags
        uses: ./.github/actions/mpiexec-flags
        with:
          mpi: ${{ matrix.run }}

      # test/ configured exactly as the mpif job configured it for the *built*
      # MPI -- compilers, header and library all from the built mpif's remembered
      # default -- except that the launcher is the *runtime* MPI's and the tests
      # expect the runtime implementation's MPI_Get_library_version.
      - name: Cross-run test/ (same binaries, swapped runtime)
        run: |
          link_prefix=$("${MPIF_PREFIX}/bin/mpifort" -showme:mpiprefix)
          cmake_args=()
          if [[ -n ${MPIEXEC_PREFLAGS:-} ]]; then
              cmake_args+=("-DMPIEXEC_PREFLAGS=${MPIEXEC_PREFLAGS}")
          fi
          cmake \
              -Stest \
              -Bbuild-tests \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_Fortran_COMPILER="${FC}" \
              -DMPI_C_COMPILER="${link_prefix}/bin/mpicc" \
              -DMPI_Fortran_COMPILER="${MPIF_PREFIX}/bin/mpifort" \
              -DMPI_C_HEADER_DIR="${link_prefix}/include" \
              -DMPI_C_LIB_NAMES=mpi_abi \
              -DMPI_mpi_abi_LIBRARY="${link_prefix}/lib/libmpi_abi.${SHLIB_EXT}" \
              -DMPIEXEC_EXECUTABLE="${RUN_PREFIX}/bin/mpiexec" \
              -DMPIF_TEST_MPI_LIBRARY="${MPIF_TEST_MPI_LIBRARY}" \
              "${cmake_args[@]}"
          cmake --build build-tests --parallel
          # The swap itself, at ctest time and not at link time
          if [[ ${RUNNER_OS} == macOS ]]; then
              DYLD_LIBRARY_PATH="${RUN_PREFIX}/lib" \
                  ctest --test-dir build-tests --output-on-failure
          else
              LD_LIBRARY_PATH="${RUN_PREFIX}/lib" \
                  ctest --test-dir build-tests --output-on-failure
          fi

      # The broad test: the MPICH suite, ~300 Fortran tests, with the Fortran side
      # supplied by the mpif built against the other implementation.
      # test-mpich-suite.sh relinks against its first argument and gates against
      # that runtime MPI's expected-failure rows; a cross run must therefore
      # report exactly what the native run of that MPI reported.
      - name: Cross-run the MPICH suite (relinked against the runtime)
        run: |
          if [[ ${RUNNER_OS} == Linux ]]; then
              export LD_LIBRARY_PATH="${RUN_PREFIX}/lib"
          fi
          ci-scripts/suite/test-mpich-suite.sh "${RUN_PREFIX}" "${MPIF_PREFIX}"

      - name: Show CMake's check logs
        if: failure()
        run: |
          for log in build-tests/CMakeFiles/CMakeConfigureLog.yaml \
                     build-tests/CMakeFiles/CMakeError.log; do
              if [[ -f ${log} ]]; then
                  echo "::group::${log}"
                  cat "${log}"
                  echo "::endgroup::"
              fi
          done

  # The 32-bit variant, which the job above cannot express. The suite's
  # expected-failure list is keyed on `uname -m` among other things, and a `-m32`
  # build on an x86_64 runner still reports `x86_64` -- so it would share a row
  # with the 64-bit build, which is the one collision that key exists to prevent.
  # A 32-bit userland reports a 32-bit `uname`; a 32-bit compiler flag does not.
  # (Ubuntu's i386 multiarch package set is also a whitelist that has no
  # `libhwloc-dev:i386`.)
  #
  # So this runs the container instead, which is where the 32-bit variants are
  # described anyway. `linux/386` executes natively on the x86_64 kernel -- no
  # qemu -- so it costs about what the jobs above cost. The dockerfile builds
  # MPICH, builds and installs mpif, runs test/ and then runs the suite, all as
  # `RUN` steps, so a build that succeeds is a test run that passed.
  #
  # MPICH only, and not for cost: Open MPI's release notes say "32-bit
  # environments are no longer supported". See MISSING.md. gcc only because
  # flang has no 32-bit x86 Fortran runtime to speak of.
  #
  # `docker/mpich-gcc-arm32v7.dockerfile` is the other 32-bit ABI and is not here:
  # every instruction is emulated, and MPICH from source plus ~300 suite tests
  # does not fit this timeout. Worth adding on a schedule.
  container:
    name: ${{ matrix.variant }} (container)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        variant: [mpich-gcc-i386]
        include:
          - variant: mpich-gcc-i386
            platform: linux/386

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # For the GitHub Actions cache backend below, which the default `docker`
      # driver does not support.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The image is not pushed or loaded: the build itself is the test. Layer
      # caching stands in for the three caches the job above keeps, and the
      # dockerfile is ordered for it -- the suite's files arrive in the last
      # `COPY`, so editing the expected-failures list reuses the MPICH layer
      # instead of rebuilding it. `mode=max` because the layer worth reusing is
      # an intermediate one; the final image is thrown away.
      #
      # That competes for the repository's 10 GB of Actions cache with the three
      # caches the job above keeps per variant. If it starts evicting them --
      # visible as MPI cache misses on runs that changed nothing the key covers --
      # drop the `cache-to` line and let this job rebuild MPICH each time. It is a
      # native build, so that costs minutes rather than the hour it would cost
      # under qemu.
      - name: Build and test in a ${{ matrix.platform }} container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.variant }}.dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # A third operating system, which the stages above cannot express because
  # GitHub has no FreeBSD runner: an Ubuntu runner boots a FreeBSD VM under qemu
  # and runs the same recipe inside it -- install MPICH, build and install mpif,
  # run test/, run MPICH's Fortran suite.
  #
  # It earns its place by being a libc, a linker and a toolchain layout that
  # nothing else here covers, on a platform where mpif's assumptions had never
  # been run at all. Both of the portability defects this job's own preparation
  # found were in the recipe rather than in the bindings -- `#!/bin/bash`, which
  # is not a path FreeBSD has, and the two readelf implementations printing
  # SONAME differently -- and both are fixed in ci-scripts/ rather than worked
  # around here.
  #
  # The compilers are the platform's own mix, which is neither of the two
  # toolchains the matrix above knows. C and C++ come from the base system, whose
  # compiler is clang -- FreeBSD ships no GCC at all -- so `cc` and `c++` here are
  # what a FreeBSD user compiles with. Fortran has to come from a package, and it
  # has to be gfortran: no llvm port builds flang, `FLANG` being in
  # `OPTIONS_DEFINE` and in no `OPTIONS_DEFAULT` for devel/llvm20 through
  # llvm23 (its build wants ~10 GB per process), and there is no standalone flang
  # port, so no binary package has one. gfortran from the `gcc` metaport is what
  # FreeBSD's own ports tree compiles Fortran software with.
  #
  # So `clang+gfortran`, and the suite's variant key calls it
  # `mpich/gcc/freebsd/14/amd64`: that component is detected from mpif's own
  # `mpifort --version`, so it names the *Fortran* compiler, which is the one an
  # expected-failures list of Fortran tests is about. Two things follow from the
  # key and are worth knowing before reading a failure here:
  # - `amd64` is FreeBSD's own word for what Linux and macOS call x86_64, so the
  #   per-architecture rows of that list match nothing here, and the ones that are
  #   really about 64-bit-ness need an amd64 twin when this variant is triaged.
  # - Until then it has no `triaged` line, so the suite reports its differences
  #   and cannot fail the run, which is how a platform nobody has measured
  #   arrives.
  #
  # MPICH only. Open MPI refuses to run as root without --allow-run-as-root, and
  # the action's `run` block is root (measured: `$HOME` is /root), so covering it
  # would mean passing that flag everywhere on one platform alone.
  freebsd:
    name: mpich / clang+gfortran / freebsd (VM)
    runs-on: ubuntu-24.04
    # Generous, this one having no MPI cache (see below) and running everything
    # inside a VM. Measured on the first run: 90 seconds to boot the VM and
    # install the packages, then six and a half minutes for MPICH from source
    # (`autogen.sh` included), mpif, and building all of test/ -- so the suite,
    # which that run never reached, is the only part whose cost is still unknown.
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The release is pinned rather than left to the action's default, because
      # the major version is a component of the suite's variant key: a default
      # that moves would retire `.../freebsd/14/...` without anyone editing
      # anything, exactly as the `os:` list above is pinned so that a runner
      # image bump is somebody's decision.
      #
      # No MPI cache, deliberately. The three caches the `mpi` jobs keep live
      # on the host, and what is expensive here happens in the VM, whose
      # filesystem the host sees only through the synchronised workspace -- so
      # caching would mean building MPICH into the workspace and trusting a
      # round trip through rsync to preserve an installation of symlinks,
      # RPATHs and wrapper scripts. That is a lot of machinery to save a build
      # this job does once per run; it can be added if the run time becomes a
      # problem.
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          # The default shell is tcsh, which none of this is written in
          usesh: true
          # Nothing here produces an artifact the host wants, and mpif's two
          # build trees are hundreds of megabytes inside the workspace: without
          # this they would be rsync'ed back at the end of the job.
          copyback: false
          # Root-only work, and all of it: `run` below installs nothing.
          #
          # The `gcc` metaport is here for gfortran alone; C and C++ come from the
          # base system. python3 is for MPICH's `autogen.sh`, which the install
          # script runs because the patches it applies reach the binding
          # generators; curl, git, bash and gmake are not in the base system.
          #
          # The image's hostname is `freebsd` and nothing resolves it, which is
          # not a curiosity: MPICH's ch3:nemesis:tcp resolves the host's own name
          # to build the business card, so with more than one process every
          # MPI_Init dies with "GetSockInterfaceAddr(372): gethostbyname failed,
          # freebsd (errno 2)". That is measured -- it failed the 15 tests of
          # test/ that use two or more ranks, and passed the other 54, in the run
          # of 911f78f. Fixed at the root, by giving the name an address, rather
          # than by telling MPICH which interface to use: an MPI is entitled to
          # resolve the name the system gave it, the same would have had to be
          # said again for Open MPI or any other implementation, and provisioning
          # a VM we boot ourselves is not the same thing as papering over a
          # defect on a machine we found.
          prepare: |
            printf '127.0.0.1 %s\n' "$(hostname)" >>/etc/hosts
            pkg install -y \
                autoconf \
                automake \
                bash \
                cmake \
                curl \
                gcc \
                git \
                gmake \
                hwloc2 \
                libtool \
                perl5 \
                pkgconf \
                python3
          run: |
            set -e
            freebsd-version
            uname -a

            # Everything this job writes goes here, outside the checked-out
            # repository: the MPI source tree, the two prefixes, the suite's
            # tree and the shim below. Not for space -- the workspace is on the
            # same filesystem -- but because `install-mpich.sh` applies its
            # patches with `git apply`, and unpacking MPICH inside a git work
            # tree makes that a question about which repository it means. The
            # VM is thrown away either way, and `copyback: false` above means
            # nothing here would reach the host in any case.
            work=${HOME:-/tmp}/mpif-vm
            mkdir -p "${work}"

            # GNU make, ahead of FreeBSD's own on PATH. MPICH's build wants it,
            # and so does the suite: `runtests` shells out to `make` for every
            # test it builds, and nothing of ours is in between, so a MAKE
            # variable would reach the first and not the second. One symlink
            # covers both.
            shims=${work}/shims
            mkdir -p "${shims}"
            ln -sf /usr/local/bin/gmake "${shims}/make"
            PATH=${shims}:${PATH}
            export PATH
            make --version | head -1

            # C and C++ from the base system, which on FreeBSD is clang. `cc`
            # and `c++` rather than `clang` and `clang++`, because those are the
            # names the platform guarantees.
            CC=cc
            CXX=c++

            # Fortran from the package, and gfortran because there is no
            # packaged flang; see the comment on this job. The `gcc` metaport
            # installs `gfortran` as a symlink to whichever version is current
            # and `gfortran14` beside it, so find the compiler rather than
            # pinning a version here that pkg would outgrow without saying so.
            # Kept a bare name, as in the jobs above, so that the wrapper
            # compilers MPICH and mpif install do not record a path.
            FC=""
            for candidate in /usr/local/bin/gfortran /usr/local/bin/gfortran[0-9]*; do
                if [ -x "${candidate}" ]; then
                    FC=${candidate##*/}
                    break
                fi
            done
            if [ -z "${FC}" ]; then
                echo "no gfortran in /usr/local/bin" >&2
                exit 1
            fi
            export CC CXX FC
            ${CC} --version | head -1
            ${FC} --version | head -1

            MPI_PREFIX=${work}/opt/mpi-mpich
            MPIF_PREFIX=${work}/opt/mpif-mpich
            MPI_SRC_DIR=${work}/mpi-src
            # pkg installs into /usr/local, which is not a compiler's default
            # include path on FreeBSD
            HWLOC_PREFIX=/usr/local
            export MPI_SRC_DIR HWLOC_PREFIX

            bash ci-scripts/install-mpich.sh "${MPI_PREFIX}"

            PATH=${MPI_PREFIX}/bin:${PATH}
            LD_LIBRARY_PATH=${MPI_PREFIX}/lib
            export PATH LD_LIBRARY_PATH

            cmake \
                -Bbuild \
                -DBUILD_SHARED_LIBS=ON \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER="${CC}" \
                -DCMAKE_Fortran_COMPILER="${FC}" \
                -DCMAKE_INSTALL_PREFIX="${MPIF_PREFIX}" \
                -DMPI_HOME="${MPI_PREFIX}"
            cmake --build build --parallel
            cmake --install build

            # As in the `mpif` job: what the tests build and run against is the
            # default the mpif installation remembers, read back from the
            # installed wrapper rather than respecified.
            mpi_prefix=$("${MPIF_PREFIX}/bin/mpifort" -showme:mpiprefix)
            cmake \
                -Stest \
                -Bbuild-tests \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER="${CC}" \
                -DCMAKE_Fortran_COMPILER="${FC}" \
                -DMPI_C_COMPILER="${mpi_prefix}/bin/mpicc" \
                -DMPI_Fortran_COMPILER="${MPIF_PREFIX}/bin/mpifort" \
                -DMPI_C_HEADER_DIR="${mpi_prefix}/include" \
                -DMPI_C_LIB_NAMES=mpi_abi \
                -DMPI_mpi_abi_LIBRARY="${mpi_prefix}/lib/libmpi_abi.so" \
                -DMPIEXEC_EXECUTABLE="${mpi_prefix}/bin/mpiexec" \
                -DMPIF_TEST_MPI_LIBRARY=MPICH
            cmake --build build-tests --parallel
            ctest --test-dir build-tests --output-on-failure

            # No MPIR_CVAR_NEMESIS_TCP_NETWORK_IFACE here, unlike
            # scripts/macos-test-mpich-suite.sh: the `/etc/hosts` line in
            # `prepare` gives the host's own name an address, so the business
            # card a spawned child connects back to is 127.0.0.1 and the
            # loopback is what MPICH picks anyway. On that machine the name
            # resolves to a *different* host, which is not ours to fix, hence
            # the CVAR there and not here.
            MPICH_TESTS_DIR=${work}/tests
            export MPICH_TESTS_DIR
            bash ci-scripts/suite/test-mpich-suite.sh \
                "${mpi_prefix}" "${MPIF_PREFIX}"
